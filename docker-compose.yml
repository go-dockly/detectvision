services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats-publisher:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/nats_publisher"]
    environment:
      NATS_URL: nats://nats:4222
      GRPC_ADDR: 0.0.0.0:50051
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - "50051:50051"

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/ingest_server"]
    environment:
      GRPC_ADDR: 0.0.0.0:50052
      PUBLISHER_ADDR: nats-publisher:50051
    depends_on: [nats-publisher]
    ports:
      - "50052:50052"

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/consumer"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on: [nats-publisher]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  clickhouse-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/app/clickhouse_consumer"]
    restart: unless-stopped
    environment:
      NATS_URL: nats://nats:4222
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "pass"
      CLICKHOUSE_DB: default
    depends_on:
      - nats-publisher
      - clickhouse

  # CV client – build with Dockerfile.client (OpenCV + ONNX)
  # Usage:
  #   docker compose run --rm -v /path/to/video.mp4:/data/video.mp4:ro client
  #   docker compose run --rm client /data/video.mp4 /app/models/yolo11n.onnx
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    profiles: ["client"]
    environment:
      INGEST_ADDR: ingest:50052
    depends_on: [ingest]
    # optional: pass through a webcam on Linux
    # devices:
    #   - /dev/video0:/dev/video0
    volumes:
      - ${VIDEO_FILE:-./assets/sample.mp4}:/data/video.mp4:ro

volumes:
  clickhouse-data:
